<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>PHOTOS APP</title>
        <link rel="stylesheet" href="photos.css">
    </head>
    <body>
        <div class="phone">
            <div id="statusbar">
                <h3 id="time">--:--</h3>
                <div class="cam-circle" aria-hidden="true"></div>
                <h3><span>📶 | </span><span id="battery">Checking…</span></h3>
            </div>
            <h2 id="heading">WELCOME TO PHOTOS APP</h2><br><br>
            <h3 class="date">17 oct,2026</h3>
            <div class="photo_div">
                <div class="photos"><img src="https://picsum.photos/seed/city/300/300"></div>
                <div class="photos"><img src="https://picsum.photos/seed/flowers/300/300"></div>
            </div>
            <h3 class="date">1 oct,2026</h3>
            <div class="photo_div">
                <div class="photos"><img src="https://picsum.photos/seed/nature/300/300"></div>
            </div>
            <h3 class="date">30 sep,2026</h3>
            <div class="photo_div">
                <div class="photos"><img src="https://picsum.photos/seed/travel/300/300"></div>
                <div class="photos"><img src="https://picsum.photos/seed/sky/300/300"></div>
            </div>
        </div>
        <script src="photos.js"></script>
    </body>
</html>
