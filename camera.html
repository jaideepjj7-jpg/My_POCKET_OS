<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camera</title>
<style>
html,body{margin:0;min-height:100%}
body{display:grid;padding-bottom:0px;background:#fff}
.cam-circle{
  width:20px;height:20px;
  border:2px solid gray;
  background:#444;
  border-radius:50%;
  position:absolute;
  left:50%;
  margin:5px;
  transform:translateX(-50%);
  box-sizing:border-box;
  z-index:7;
}
.phone{width:470px;height:970px;background:#0a0a14;border:5px solid black;box-shadow:0 0 15px gray;border-radius:20px;justify-self:center;margin-top:50px;position:relative;overflow:hidden;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}

/* camera screen */
#cam{position:absolute;inset:0;z-index:10;background:#000;transform:translateY(100%);transition:transform .4s cubic-bezier(.2,.8,.2,1)}
#cam.open{transform:none}
.view{position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,#3b4a6b,#0b0e1a 70%);overflow:hidden}
.view::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 33%,rgba(255,255,255,.25) 33%,transparent calc(33% + 1px),transparent 66%,rgba(255,255,255,.25) 66%,transparent calc(66% + 1px)),linear-gradient(transparent 33%,rgba(255,255,255,.25) 33%,transparent calc(33% + 1px),transparent 66%,rgba(255,255,255,.25) 66%,transparent calc(66% + 1px))}
.view::after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:#ff9a62;filter:blur(70px);opacity:.4;animation:float 6s ease-in-out infinite alternate;left:80px;top:300px}
@keyframes float{to{transform:translate(40px,-60px) scale(1.15)}}
.cx{position:absolute;top:50px;left:20px;font-size:26px;width:44px;height:44px}
.sh{position:absolute;bottom:60px;left:50%;margin-left:-37px;width:74px;height:74px;border-radius:50%;border:4px solid #fff;box-sizing:border-box;background:none;padding:5px}
.sh i{display:block;width:100%;height:100%;border-radius:50%;background:#fff;transition:transform .12s}
.sh:active i{transform:scale(.85)}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:fl .35s}
@keyframes fl{from{opacity:.9}to{opacity:0}}

/* toast */
.toast{position:absolute;bottom:170px;left:50%;transform:translate(-50%,20px);background:rgba(0,0,0,.65);padding:9px 18px;border-radius:20px;font-size:14px;opacity:0;transition:.3s;z-index:12;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

    .toast.show{opacity:1;transform:translate(-50%,0)}
}
</style>
</head>
<body>
<div class="phone">
    <div class="cam-circle"></div>
  <!-- camera screen -->
  <div id="cam" class="open">
    <div class="view"></div>
    <button class="cx" id="cx" aria-label="Close"></button>
    <button class="sh" id="shut" aria-label="Shutter"><i></i></button>
    <div class="flash" id="flash"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
const $=s=>document.querySelector(s);

let tt;
function toast(m){
  const t=$('#toast');t.textContent=m;t.classList.add('show');
  clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1600);
}

$('#cx').onclick=()=>$('#cam').classList.remove('open');
$('#shut').onclick=()=>{
  const f=$('#flash');
  f.classList.remove('go');void f.offsetWidth;f.classList.add('go');
  toast('Photo captured');
};
</script>
</body>
</html>
